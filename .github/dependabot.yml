version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /resources/js
    schedule:
      interval: weekly
    groups:
      javascript-development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

